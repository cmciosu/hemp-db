<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="canonical" href="https://hempdb.cass.oregonstate.edu/">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <title>HempDB has moved</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f8f9fa;
        color: #212529;
        font-family: 'Inter', Arial, sans-serif;
        line-height: 1.6;
      }
      header {
        background: linear-gradient(rgba(255, 255, 255, .15), transparent), #198754;
        color: white;
      }
      header { padding: .75rem 1.5rem; font-size: 1.25rem; }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 3rem 1.5rem;
        text-align: center;
      }
      section { max-width: 42rem; }
      h1 { margin: 0 0 1.5rem; font-size: 1.75rem; font-weight: 500; line-height: 1.2; }
      p { margin: 1rem 0; }
      .destination { margin: 2rem 0; }
      a { color: #146c43; font-size: clamp(1.4rem, 4.5vw, 2.25rem); font-weight: 600; overflow-wrap: anywhere; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <header>HempDB</header>
    <main>
      <section aria-labelledby="notice-title">
        <h1 id="notice-title">HempDB has moved</h1>
        <p class="destination"><a id="destination" href="https://hempdb.cass.oregonstate.edu/">hempdb.cass.oregonstate.edu</a></p>
        <p>Please update your bookmarks. This old site will be taken offline soon.</p>
      </section>
    </main>
  </body>
</html>
